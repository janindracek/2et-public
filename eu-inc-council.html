<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU Inc. — kvalifikovaná většina v Radě</title>
<style>
:root{
  --paper:#f3ece0; --paper2:#ece2d2; --ink:#2c2820; --muted:#7c7264; --line:#d7ccb6;
  --card:#fbf7ee; --accent:#b5612e;
  --hard-yes:#2f6b4f; --probable-yes:#86b394; --middle:#e2b347; --probable-no:#d08a4d; --hard-no:#a73b2b;
  --tile:64px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 56px}
.banner{background:#322c22;color:#e9dcc4;font-size:12px;padding:6px 14px;text-align:center;letter-spacing:.2px}
.banner code{color:#f0c98a;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}

.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:22px 0 6px}
h1{font-size:21px;margin:0;letter-spacing:-.3px}
.asel{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.adesc{font-size:13px;color:var(--muted);font-style:italic;margin:5px 0 -2px;max-width:760px}

/* stance colors — shared by tiles, segments, dots, flagdots */
.s-hard-yes{background:var(--hard-yes);color:#f4efe2}
.s-probable-yes{background:var(--probable-yes);color:#1f3a2a}
.s-middle{background:var(--middle);color:#4a3a12}
.s-probable-no{background:var(--probable-no);color:#412813}
.s-hard-no{background:var(--hard-no);color:#f6e7e2}

/* layout: map (input) left · eval rail (output) right */
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:22px;margin-top:14px;align-items:start}
.inputpane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.evalrail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:14px}
.mapctrl{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.mapctrl .spacer{flex:1 1 auto}
.hint{font-size:12px;color:var(--muted);margin:-2px 0 10px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px}
.dist{font-size:11px;font-weight:700;padding:2px 9px;border-radius:11px;white-space:nowrap}
.dist.ok{color:var(--hard-yes);background:#dcebe2} .dist.bad{color:var(--hard-no);background:#f1ddd6}
@media(max-width:920px){.main{grid-template-columns:1fr} .evalrail{position:static;order:-1}}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qbig{font-size:29px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.qbig .dot{width:16px;height:16px;border-radius:50%}
.rdiv{border-top:1px solid var(--line);margin:15px 0}
.pass{color:var(--hard-yes)} .pass .dot{background:var(--hard-yes)}
.fail{color:var(--hard-no)} .fail .dot{background:var(--hard-no)}
.qnums{font-size:14px;color:var(--muted)} .qnums b{color:var(--ink)}
.qsub{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:560px}
.unan{font-size:12.5px;color:var(--muted);margin-top:9px;border-left:3px solid var(--line);padding-left:9px}
.unan b{color:var(--ink)}

.bars{display:flex;flex-direction:column;gap:18px;margin:6px 0 2px}
.barblock{display:flex;flex-direction:column;gap:5px}
.barhdr{display:flex;justify-content:space-between;align-items:baseline}
.barhdr .blab{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink)}
.barhdr .bval{font-size:13.5px;color:var(--muted)}
.barhdr .bval b{color:var(--ink);font-weight:800;font-size:16px}
.track{position:relative;width:100%;height:30px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--paper2);display:flex}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;min-width:0}
.seg .segn{opacity:.5;font-weight:600}
.thr{position:absolute;top:-3px;bottom:-3px;width:2px;background:#3a342a;z-index:3}
.barcap{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;font-size:13px}
.controls .grp{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted)}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer}
button:hover{background:#f0e7d6}
.seglist{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seglist button{border:0;border-radius:0;border-right:1px solid var(--line);padding:5px 9px}
.seglist button:last-child{border-right:0}
.seglist button.on{background:var(--accent);color:#fff}
.modnote{font-size:12.5px;color:var(--accent)}

/* map */
.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:6px}
.tilemap{display:grid;grid-template-columns:repeat(8,var(--tile));gap:5px}
.tilemap.mode-tiles{grid-auto-rows:var(--tile)}
.maparea{height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cartomap{padding:0;display:flex;align-items:center;justify-content:center;width:100%}
.cartomap svg{display:block;margin:0 auto;max-width:100%;max-height:512px}
.tile{border-radius:9px;border:1.5px solid rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;user-select:none;transition:transform .08s, box-shadow .12s;padding:2px}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.16);z-index:3}
.tile .iso{font-weight:800;font-size:16px;letter-spacing:.3px}
.tile .pp{font-size:9.5px;opacity:.82;line-height:1}
.tile.conf-low{border-style:dashed;border-color:rgba(0,0,0,.32)}
.tile .e6{position:absolute;bottom:3px;right:3px;font-size:8px;font-weight:800;letter-spacing:.3px;line-height:1.1;color:var(--paper);background:var(--ink);padding:1px 3px;border-radius:7px;box-shadow:0 0 0 1px rgba(251,247,238,.55)}
.tile .lb{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#c0392b;color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 1.5px rgba(251,247,238,.9),0 1px 3px rgba(0,0,0,.25);z-index:4}
.tile.mod{box-shadow:0 0 0 2.5px var(--accent),0 4px 12px rgba(0,0,0,.18)}
/* dot cartogram */
.cell{cursor:pointer;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px;align-self:end}
.cluster{display:flex;flex-wrap:wrap;gap:1px;align-content:flex-end;justify-content:center}
.cluster i{width:5px;height:5px;border-radius:1.5px;background:var(--c);display:block}
.cell .dlabel{font-size:9px;font-weight:700;color:var(--muted)}
.cell.mod .cluster{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.legend{margin-top:14px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.legend .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.legend .legdot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1}
.legend .lb-dot{width:15px;height:15px;border-radius:50%;background:#c0392b;color:#fff;font-size:9px;font-weight:700}
.legend .e6-dot{background:var(--ink);color:var(--paper);font-size:8px;font-weight:800;padding:1px 4px;border-radius:7px;letter-spacing:.3px}

/* table — dva sloupce karet */
.tablewrap{margin-top:16px}
.ctable{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
.ccol{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chead{display:grid;grid-template-columns:1.5fr 1.1fr .7fr 1fr .55fr;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.chead span{cursor:pointer}.chead span:hover{color:var(--ink)}
.crow{border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.crow .summary{display:grid;grid-template-columns:1.5fr 1.1fr .7fr 1fr .55fr;gap:8px;padding:7px 11px;cursor:pointer;align-items:baseline;font-size:13px}
.crow .summary:hover{background:#f5ecdb}
.crow .summary .scell{font-weight:700;white-space:nowrap}
.crow .detail{display:none;background:#f8f1e3;padding:9px 12px;font-size:12.5px;color:#433c30;line-height:1.5}
.crow.open .detail{display:block}
.crow .detail .lab{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
.flagdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.cf{font-size:12px;color:var(--muted)}
.badge{font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.warnb{border-color:var(--hard-no);color:var(--hard-no);font-weight:600}
@media(max-width:720px){.ctable{grid-template-columns:1fr}}
.foot{font-size:11.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:11px;line-height:1.6}
@media(max-width:1040px){.tablewrap{margin-top:14px}}
@media(max-width:560px){:root{--tile:40px} .mapwrap{padding:9px} .tile .iso{font-size:14px} .tile .pp{display:none} h1{font-size:19px} .wrap{padding:0 10px 48px}}
</style>
</head>
<body>
<div class="banner">Interaktivní model postojů 27 členských států EU k EU Inc. · balík a ESOP (čl. 79) zvlášť · data k 15. 10. 2026 · klikni na stát pro přepočet</div>
<div class="wrap">

<div class="topbar">
  <h1>EU Inc. — kvalifikovaná většina v Radě</h1>
  <select class="asel" id="asel" onchange="selectAssessment(this.value)"></select>
</div>
<div class="adesc" id="adesc"></div>

<div class="main">
  <section class="inputpane">
    <div class="mapctrl">
      <button onclick="reset()">↺ Výchozí</button>
      <span class="modnote" id="modnote"></span>
      <span class="spacer"></span>
      <div class="grp">Mapa:
        <span class="seglist" id="seg-map">
          <button data-v="tiles" class="on" onclick="setMap('tiles')">dlaždice</button>
          <button data-v="populace" onclick="setMap('populace')">populace</button>
        </span>
      </div>
    </div>
    <div class="hint">Klikni na stát — postoj cykluje přes 5 úrovní (Hard NO → Hard YES).</div>
    <div class="maparea"><div class="tilemap mode-tiles" id="tilemap"></div></div>
    <div class="legend">
      <div class="row" id="leg-stance"></div>
      <div class="row" id="leg-note"></div>
    </div>
  </section>

  <aside class="evalrail">
    <div class="eyebrow">Kvalifikovaná většina (QMV)</div>
    <div class="qhead"><div class="qbig" id="qverdict"><span class="dot"></span><span class="t">—</span></div></div>
    <div class="qsub" id="qsub"></div>
    <div class="rdiv"></div>
    <div class="bars" id="bars"></div>
    <div class="rdiv"></div>
    <div class="grp" style="margin-top:12px">„Middle":
      <span class="seglist" id="seg-middle">
        <button data-v="abstain" class="on" onclick="setMiddle('abstain')">zdržení</button>
        <button data-v="no" onclick="setMiddle('no')">NE</button>
      </span>
    </div>
    <div class="unan" id="unan"></div>
  </aside>
</div>

<div class="tablewrap">
  <div class="ctable" id="ctable"></div>
</div>

<div class="foot" id="foot"></div>

</div>

function cstat(n){ if(n===1) return "stát"; if(n>=2&&n<=4) return "státy"; return "států"; }
const NBSP=" ";
function czp(s){
  if(s==null) return s;
  s=String(s).replace(/—/g,"–");
  s=s.replace(/(^|[\s(„"–])([ksvzouaiKSVZOUAI])\s+(?=\S)/g,"$1$2"+NBSP);
  s=s.replace(/\b(čl|č|odst|písm|str)\.\s+(?=\d)/g,"$1."+NBSP);
  s=s.replace(/(\d)\s+(%|mil\.|mld|mln|€|Kč|b\.)/g,"$1"+NBSP+"$2");
  s=s.replace(/(\d{1,2})\.\s+(\d{1,2})\.\s+(\d{2,4})/g,"$1."+NBSP+"$2."+NBSP+"$3");
  return s;
}

let A, TOTAL, baseline={}, work, middleAs="abstain", mapMode="tiles", sortKey="population_m", sortDir=-1, openRows=new Set();

function loadAssessment(id){
  A = PAYLOAD.assessments.find(a=>a.id===id) || PAYLOAD.assessments[0];
  TOTAL = A.total_pop;
  baseline = {}; A.states.forEach(s=>baseline[s.iso]=s.stance);
  work = JSON.parse(JSON.stringify(A.states));
  openRows = new Set();
}
function selectAssessment(id){ loadAssessment(id); renderAll(); }

function voteOf(s){ if(s==="hard_yes"||s==="probable_yes") return "yes"; if(s==="middle") return middleAs==="no"?"no":"abstain"; return "no"; }
function compute(){
  let yesStates=0,yesPop=0; const noList=[];
  work.forEach(d=>{ const v=voteOf(d.stance);
    if(v==="yes"){yesStates++;yesPop+=d.population_m;} else if(v==="no"){noList.push(d);} });
  const yesPct=yesPop/TOTAL*100;
  const noPop=noList.reduce((a,d)=>a+d.population_m,0), noPct=noPop/TOTAL*100;
  return {yesStates,yesPop,yesPct,noList,noPct,
    qmvPass:(yesStates>=15 && yesPct>=65), blocking:(noList.length>=4 && noPct>35),
    unanPass:(noList.length===0)};
}
function tally(){ const cnt={},pop={}; ORDER.forEach(s=>{cnt[s]=0;pop[s]=0;}); work.forEach(d=>{cnt[d.stance]++;pop[d.stance]+=d.population_m;}); return {cnt,pop}; }
function names(l){ return l.map(d=>d.iso).join(", "); }
function modified(){ return work.filter(d=>d.stance!==baseline[d.iso]); }

function renderQMV(){
  const c=compute();
  const v=document.getElementById("qverdict");
  v.className="qbig "+(c.qmvPass?"pass":"fail");
  v.querySelector(".t").textContent=(c.qmvPass?"PROCHÁZÍ":"NEPROCHÁZÍ");
  document.getElementById("qsub").innerHTML=czp(
    c.qmvPass ? "Odpůrci mají "+c.noPct.toFixed(0)+" % populace — "+(c.blocking?"<b>tvoří blokační menšinu</b>.":"daleko od blokační menšiny (>35 % a ≥4 státy).")
              : (c.blocking?"<b>Blokační menšina:</b> "+names(c.noList)+" = "+c.noPct.toFixed(0)+" %.":"Nedostatek hlasů pro."));
  const mids=work.filter(d=>d.stance==="middle");
  document.getElementById("unan").innerHTML = czp(c.unanPass
    ? "Pod jednomyslností ("+A.unan_label+"): <b>nikdo není na NE</b>"+(mids.length?", ale "+mids.length+" "+cstat(mids.length)+" na vážkách jako wildcardy.":".")
    : "Pod jednomyslností ("+A.unan_label+") by <b>blokovalo: "+names(c.noList)+"</b>"+(mids.length?" (+ "+mids.length+" na vážkách).":"."));
  const mc=modified().length;
  document.getElementById("modnote").textContent = mc? czp("✎ "+mc+" "+cstat(mc)+" jinak než výchozí odhad") : "";
}

function barBlock(name, vals, total, thrAbs, thrLabel, yesVal, isPop){
  const thrPct=(thrAbs/total*100);
  let segs="";
  ORDER.forEach(s=>{ const v=vals[s]; if(v<=0) return; const pct=v/total*100;
    segs+="<div class='seg "+scls(s)+"' style='flex-basis:"+pct+"%' title='"+STANCE_LBL[s]+": "+(isPop?v.toFixed(1)+' mil.':v+'×')+"'>"+(pct>9?"<span class='segn'>"+(isPop?Math.round(v):v)+"</span>":"")+"</div>";
  });
  const valHTML = isPop ? "<b>"+yesVal.toFixed(0)+" %</b>" : "<b>"+yesVal+"</b> z "+total;
  const d = isPop ? Math.round(yesVal-65) : (yesVal-thrAbs), ok=d>=0;
  const dTxt = isPop ? ((ok?"+":"−")+Math.abs(d)+" b. "+(ok?"nad":"pod")+" prahem")
                     : ((ok?"+":"−")+Math.abs(d)+" "+cstat(Math.abs(d))+" "+(ok?"nad":"pod")+" prahem");
  return "<div class='barblock'>"+
    "<div class='barhdr'><span class='blab'>"+name+"</span><span class='bval'>"+czp(valHTML)+"</span></div>"+
    "<div class='track'>"+segs+"<div class='thr' style='left:"+thrPct+"%'></div></div>"+
    "<div class='barcap'><span>"+czp("práh "+thrLabel)+"</span><span class='dist "+(ok?"ok":"bad")+"'>"+czp(dTxt)+"</span></div>"+
    "</div>";
}
function renderBars(){
  const t=tally(), c=compute();
  document.getElementById("bars").innerHTML =
    barBlock("Státy", t.cnt, work.length, 15, "≥15 z "+work.length, c.yesStates, false) +
    barBlock("Populace", t.pop, TOTAL, TOTAL*0.65, "65 %", c.yesPct, true);
}

  const e6=d.e6?"<span class='e6'>E6</span>":"";

const OUTSIDE={LU:[20,-20],HR:[24,16],EE:[30,0],LV:[30,0],LT:[30,2],SE:[-30,2],FI:[28,0],MT:[0,30],CY:[30,0]};
function cartogramSVG(){
  const C=PAYLOAD.cartogram, CELL=11, MARGIN=40;
  const minX=C.minX,maxX=C.maxX,minY=C.minY,maxY=C.maxY, W=maxX-minX+1, H=maxY-minY+1;
  const stanceOf={}; work.forEach(d=>stanceOf[d.iso]=d.stance);
  const occ={}; C.cells.forEach(c=>occ[c.x+","+c.y]=c.iso);
  const sx=x=>(x-minX)*CELL+MARGIN, sy=y=>(maxY-y)*CELL+MARGIN, modOf=iso=>stanceOf[iso]!==baseline[iso];
  let rects="",borders="";
  C.cells.forEach(c=>{
    const X=sx(c.x),Y=sy(c.y),st=stanceOf[c.iso]||"middle";
    rects+="<rect x='"+X+"' y='"+Y+"' width='"+CELL+"' height='"+CELL+"' fill='"+cvar(st)+"' data-iso='"+c.iso+"' style='cursor:pointer'><title>"+c.iso+" – "+STANCE_LBL[st]+"</title></rect>";
    const m=modOf(c.iso), bc=m?"var(--accent)":"#23201a", bw=m?2:1.2;
    const E=[[0,1,X,Y,X+CELL,Y],[0,-1,X,Y+CELL,X+CELL,Y+CELL],[1,0,X+CELL,Y,X+CELL,Y+CELL],[-1,0,X,Y,X,Y+CELL]];
    E.forEach(e=>{ if(occ[(c.x+e[0])+","+(c.y+e[1])]!==c.iso) borders+="<line x1='"+e[2]+"' y1='"+e[3]+"' x2='"+e[4]+"' y2='"+e[5]+"' stroke='"+bc+"' stroke-width='"+bw+"'/>"; });
  });
  const by={}; C.cells.forEach(c=>{(by[c.iso]=by[c.iso]||[]).push(c);});
  let labels="";
  Object.keys(by).forEach(iso=>{
    const pts=by[iso], cx=pts.reduce((a,c)=>a+sx(c.x),0)/pts.length+CELL/2, cy=pts.reduce((a,c)=>a+sy(c.y),0)/pts.length+CELL/2, o=OUTSIDE[iso];
    if(o){ const lx=cx+o[0],ly=cy+o[1];
      labels+="<line x1='"+cx+"' y1='"+cy+"' x2='"+lx+"' y2='"+ly+"' stroke='#23201a' stroke-width='1' opacity='.5'/>";
      labels+="<text x='"+lx+"' y='"+ly+"' font-size='11' text-anchor='middle' dominant-baseline='middle' font-weight='800' fill='#2c2820' style='paint-order:stroke;stroke:#f3ece0;stroke-width:3px;pointer-events:none'>"+iso+"</text>";
    } else {
      labels+="<text x='"+cx+"' y='"+cy+"' font-size='11' text-anchor='middle' dominant-baseline='middle' font-weight='800' fill='#2c2820' style='paint-order:stroke;stroke:rgba(251,247,238,.8);stroke-width:2.4px;pointer-events:none'>"+iso+"</text>";
    }
  });
  const w=W*CELL+2*MARGIN,h=H*CELL+2*MARGIN;
  return "<svg viewBox='0 0 "+w+" "+h+"' style='max-width:100%;height:auto' xmlns='http://www.w3.org/2000/svg'><g>"+rects+"</g><g>"+borders+"</g><g>"+labels+"</g></svg>";
}

  const arr=[...work].sort((a,b)=>{ let x=a[sortKey],y=b[sortKey];
    if(sortKey==="stance"){x=ORDER.indexOf(x);y=ORDER.indexOf(y);}
    return typeof x==="string"? sortDir*x.localeCompare(y,'cs') : sortDir*(x-y); });
  const half=Math.ceil(arr.length/2), cols=[arr.slice(0,half), arr.slice(half)];
  const COLS=[["country_cs","Stát"],["stance","Postoj"],["confidence","Spoleh."],["camp","Tábor"],["population_m","Pop."]];
  const head="<div class='chead'>"+COLS.map(c=>"<span data-k='"+c[0]+"'>"+c[1]+"</span>").join("")+"</div>";
  const rowHTML=d=>{ const mod=d.stance!==baseline[d.iso];
    const lbB=d.legal_base!=="silent"?"<span class='badge "+(d.legal_base==="challenges_114"?"warnb":"")+"'>"+LB_LBL[d.legal_base]+"</span>":"";
    return "<div class='crow"+(openRows.has(d.iso)?" open":"")+"' data-iso='"+d.iso+"'><div class='summary'>"+
      "<span><span class='flagdot' style='background:"+cvar(d.stance)+"'></span><b>"+d.country_cs+"</b>"+(d.e6?" <span class='badge'>E6</span>":"")+(mod?" <span style='color:var(--accent)'>✎</span>":"")+"</span>"+
      "<span class='scell' style='color:"+cvar(d.stance)+"'>"+STANCE_LBL[d.stance]+"</span>"+
      "<span class='cf'>"+CONF_LBL[d.confidence]+"</span><span class='cf'>"+CAMP_LBL[d.camp]+"</span><span>"+d.population_m+"</span></div>"+
      "<div class='detail'><div>"+czp(d.one_liner)+" "+lbB+"</div><div class='lab'>Hlavní hybatel</div><div>"+czp(d.key_driver)+"</div><div class='lab'>Co s nimi pohne</div><div>"+czp(d.what_moves)+"</div><div class='lab'>Zdroje</div><div>"+d.sources.map((u,i)=>"<a href='"+u+"' target='_blank' rel='noopener'>zdroj "+(i+1)+"</a>").join(" · ")+"</div></div></div>";
  };
  document.getElementById("ctable").innerHTML = cols.map(col=>"<div class='ccol'>"+head+col.map(rowHTML).join("")+"</div>").join("");
  document.querySelectorAll("#ctable .crow").forEach(r=>{ r.querySelector(".summary").onclick=()=>{ const open=r.classList.toggle("open"); if(open)openRows.add(r.dataset.iso); else openRows.delete(r.dataset.iso); }; });
  document.querySelectorAll("#ctable .chead span").forEach(th=>{ th.onclick=()=>{ const k=th.dataset.k; if(k===sortKey)sortDir*=-1; else{sortKey=k;sortDir=(k==="country_cs"||k==="camp")?1:-1;} renderTable(); }; });
}

}
function renderAll(){ document.getElementById("adesc").textContent=czp(A.desc||""); renderQMV(); renderBars(); renderMap(); renderTable(); }
function reset(){ work=JSON.parse(JSON.stringify(A.states)); renderAll(); }
function setMiddle(v){ middleAs=v; document.querySelectorAll("#seg-middle button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); renderQMV(); renderBars(); }
function setMap(v){ mapMode=v; document.querySelectorAll("#seg-map button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); renderMap(); }

loadAssessment(PAYLOAD.assessments[0].id);
document.querySelector("h1").textContent=czp(document.querySelector("h1").textContent);
document.querySelector(".hint").textContent=czp(document.querySelector(".hint").textContent);
renderAll(); renderFoot();
